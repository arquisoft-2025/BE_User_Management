version: '3.8'

services:
  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: user_management_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_management
      MYSQL_USER: user_app
      MYSQL_PASSWORD: userpass123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql:ro
    networks:
      - user_management_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # API de gestión de usuarios
  user_management_api:
    build: .
    container_name: user_management_api
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=user_management
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - FLASK_ENV=production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - user_management_network
    volumes:
      - ./.env:/app/.env:ro

  # Prometheus para métricas (opcional)
  prometheus:
    image: prom/prometheus:latest
    container_name: user_management_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - user_management_network

volumes:
  mysql_data:
  prometheus_data:

networks:
  user_management_network:
    driver: bridge