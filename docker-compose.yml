version: '3.8'

services:
  # Base de datos MongoDB
  mongodb:
    image: mongo:7.0
    container_name: user_management_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: user_management
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - user_management_network

  # API de gestión de usuarios
  user_management_api:
    build: .
    container_name: user_management_api
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - MONGO_URI=mongodb://admin:password123@mongodb:27017/user_management?authSource=admin
      - FLASK_ENV=production
    depends_on:
      - mongodb
    networks:
      - user_management_network
    volumes:
      - ./.env:/app/.env:ro  # Si tienes variables de entorno

  # Prometheus para métricas (opcional)
  prometheus:
    image: prom/prometheus:latest
    container_name: user_management_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - user_management_network

volumes:
  mongodb_data:
  prometheus_data:

networks:
  user_management_network:
    driver: bridge